[metadata]
name = mrsegmentator
version = 2.0.0
author = Hartmut Häntze
author_email = hartmut.haentze@charite.de
description = Multi-Modality Segmentation of 40+10 Classes in MRI and CT
long_description = file: README.md, LICENSE.txt, CHANGELOG.md
long_description_content_type = text/markdown
url = https://github.com/hhaentze/mrsegmentator
project_urls =
    Bug Tracker = https://github.com/hhaentze/mrsegmentator/issues
    repository = https://github.com/hhaentze/mrsegmentator
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Intended Audience :: Healthcare Industry
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Image Recognition
    Topic :: Scientific/Engineering :: Medical Science Apps.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10, <3.14
install_requires =
    torch>=2.3, <=2.10, !=2.9
    numpy>=1.26
    nnunetv2>=2.2.1, <=2.8.0
    pydicom
    highdicom
    
[options.extras_require]
dev =
    ruff
    mypy
    pytest
    pytest-html

[options.packages.find]
where = src
exclude =
    bundles*
    data*
    logs*
    metadata*
    model*
    notebooks*
    scripts*
    src/mrsegmentator/weights

[options.entry_points]
console_scripts =
    mrsegmentator = mrsegmentator.main:main
    dcm_helper = dicom_helper.main:main